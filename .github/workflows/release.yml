name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Pushes seguidos esperam na fila, para a versão mais nova ser sempre a última publicada.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Mesmo compilador usado para validar o build (MSVC do Visual Studio 2022).
    runs-on: windows-2022
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # O build.ps1 cria o certificado autoassinado e assina com carimbo de tempo da DigiCert.
      # A chave privada existe só neste runner e é descartada quando o job termina.
      - name: Compilar e assinar
        run: ./build.ps1 -Version "$env:VERSION.0"

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSION" AstralVision.exe `
            --target "$env:GITHUB_SHA" `
            --title "Astral Vision Installer v$env:VERSION" `
            --generate-notes
