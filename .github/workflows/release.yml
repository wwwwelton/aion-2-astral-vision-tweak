name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write

# Pushes seguidos esperam na fila, para a versão mais nova ser sempre a última publicada.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Mesmo compilador usado para validar o build (MSVC do Visual Studio 2022).
    runs-on: windows-2022
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      # Sem acesso à chave: o compilador e as dependências dele rodam só nesta etapa.
      - name: Compilar
        run: ./build.ps1 -Release -Stage Compile -Version "$env:VERSION.0"

      # Certificado fixo das releases, com carimbo de tempo da DigiCert. A chave vem dos Secrets (release-cert.ps1).
      - name: Assinar
        env:
          SIGNING_PFX_BASE64: ${{ secrets.SIGNING_PFX_BASE64 }}
          SIGNING_PFX_PASSWORD: ${{ secrets.SIGNING_PFX_PASSWORD }}
        run: ./build.ps1 -Release -Stage Sign

      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$env:VERSION" AstralVision.exe `
            --target "$env:GITHUB_SHA" `
            --title "Astral Vision Installer v$env:VERSION" `
            --generate-notes
